# 业务术语定义
# 用于填充测试请求体中的terminologies字段

terminologies:
  # ========== 工单相关术语 ==========
  - term: "工单量"
    description: "工单的总数量，使用COUNT(*)统计"
    category: "metrics"
    synonyms: ["工单数", "工单总量", "工单数量"]
    
  - term: "工单"
    description: "工作单，记录工作任务的基本单位"
    category: "entity"
    synonyms: ["工作单", "任务单"]
    
  - term: "回访发起量"
    description: "回访操作的发起次数，统计回访触发的总次数"
    category: "metrics"
    synonyms: ["回访量", "回访次数"]
    
  - term: "回访成功量"
    description: "回访操作成功的次数"
    category: "metrics"
    synonyms: ["成功回访量"]
    
  - term: "回访率"
    description: "回访发起量占应回访总量的比例"
    category: "metrics"
    sql_pattern: "callback_cnt / total_cnt"
    
  - term: "回访类型"
    description: "回访的方式分类：1人工回访、2短信回访、3智能语音"
    category: "dimension"
    values:
      - value: 1
        label: "人工回访"
      - value: 2
        label: "短信回访"
      - value: 3
        label: "智能语音"
        
  - term: "满意率"
    description: "满意评价占总评价的比例，使用satisfaction_cnt / assess_cnt计算"
    category: "metrics"
    synonyms: ["满意度", "满意占比"]
    sql_pattern: "satisfaction_cnt * 100.0 / assess_cnt"
    
  - term: "逾期率"
    description: "逾期工单占应办结工单的比例"
    category: "metrics"
    synonyms: ["逾期占比"]
    sql_pattern: "overdue_cnt * 100.0 / total_cnt"
    
  - term: "办结率"
    description: "已办结工单占总工单的比例"
    category: "metrics"
    sql_pattern: "finish_cnt * 100.0 / total_cnt"
    
  - term: "及时率"
    description: "及时办结的工单占总工单的比例"
    category: "metrics"
    sql_pattern: "ontime_cnt * 100.0 / total_cnt"
    
  # ========== 订单相关术语 ==========
  - term: "订单量"
    description: "订单的总数量，使用COUNT(*)统计"
    category: "metrics"
    synonyms: ["订单数", "订单总量"]
    
  - term: "销售额"
    description: "订单金额的总和，使用SUM(amount)计算"
    category: "metrics"
    synonyms: ["营收", "GMV", "成交金额"]
    sql_pattern: "SUM(amount)"
    
  - term: "平均订单金额"
    description: "订单金额的平均值，使用AVG(amount)计算"
    category: "metrics"
    synonyms: ["客单价", "平均客单价"]
    sql_pattern: "AVG(amount)"
    
  - term: "订单状态"
    description: "订单的当前状态"
    category: "dimension"
    values:
      - value: 1
        label: "待支付"
      - value: 2
        label: "已支付"
      - value: 3
        label: "已发货"
      - value: 4
        label: "已完成"
      - value: 5
        label: "已取消"
        
  - term: "渠道"
    description: "订单来源渠道"
    category: "dimension"
    values:
      - value: "phone"
        label: "电话渠道"
      - value: "app"
        label: "APP渠道"
      - value: "web"
        label: "网页渠道"
      - value: "wechat"
        label: "微信渠道"
        
  # ========== 用户相关术语 ==========
  - term: "用户数"
    description: "用户的总数量，使用COUNT(DISTINCT user_id)统计"
    category: "metrics"
    synonyms: ["用户量", "用户总数"]
    sql_pattern: "COUNT(DISTINCT user_id)"
    
  - term: "新用户"
    description: "首次下单的用户"
    category: "user_type"
    
  - term: "老用户"
    description: "有过历史订单的用户"
    category: "user_type"
    
  - term: "活跃用户"
    description: "在指定时间范围内有操作的用户"
    category: "user_type"
    
  # ========== 时间相关术语 ==========
  - term: "昨天"
    description: "当前日期的前一天"
    category: "time"
    sql_pattern: "DATE_SUB(CURDATE(), INTERVAL 1 DAY)"
    
  - term: "最近7天"
    description: "从当前时间往前推7天的时间范围"
    category: "time"
    synonyms: ["近7天", "近一周"]
    sql_pattern: "DATE_SUB(NOW(), INTERVAL 7 DAY)"
    
  - term: "最近30天"
    description: "从当前时间往前推30天的时间范围"
    category: "time"
    synonyms: ["近30天", "近一月"]
    sql_pattern: "DATE_SUB(NOW(), INTERVAL 30 DAY)"
    
  - term: "本月"
    description: "当前月份"
    category: "time"
    sql_pattern: "DATE_FORMAT(NOW(), '%Y-%m')"
    
  - term: "上月"
    description: "上一个月"
    category: "time"
    sql_pattern: "DATE_FORMAT(DATE_SUB(NOW(), INTERVAL 1 MONTH), '%Y-%m')"
    
  - term: "环比"
    description: "与上一周期的比较"
    category: "calculation"
    sql_pattern: "(current - previous) * 100.0 / previous"
    
  - term: "同比"
    description: "与上年同期的比较"
    category: "calculation"
    sql_pattern: "(current - last_year) * 100.0 / last_year"
    
  # ========== 统计相关术语 ==========
  - term: "占比"
    description: "某部分占总体的百分比"
    category: "calculation"
    synonyms: ["百分比", "比例"]
    sql_pattern: "part * 100.0 / total"
    
  - term: "排名"
    description: "按某个指标排序后的位置"
    category: "calculation"
    synonyms: ["排行", "排序"]
    sql_pattern: "RANK() OVER (ORDER BY metric DESC)"
    
  - term: "TOP N"
    description: "排名前N的记录"
    category: "calculation"
    synonyms: ["前N名", "前N"]
    sql_pattern: "ORDER BY metric DESC LIMIT N"
    
  - term: "累计"
    description: "从起始时间到当前时间的累计值"
    category: "calculation"
    synonyms: ["累积", "累计值"]
    sql_pattern: "SUM(metric) OVER (ORDER BY date)"
